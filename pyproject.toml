[project]
name = "endcord-rpc"
version = "1.1.3"
description = "Small RPC server made from endcord parts. Provides Rich Presence and game detection only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "orjson>=3.13.0",
    "protobuf>=7.36.2",
    "pysocks>=1.7.1",
    "python-socks>=3.2.1",
    "psutil>=7.2.2; sys_platform != 'linux'",
    "pywin32>=312; sys_platform == 'win32'",
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",
    "websocket-client>=1.9.2",
]

[dependency-groups]
build = [
    "nuitka[onefile]==4.2.2",   # https://github.com/Nuitka/Nuitka/issues/4170
    "pyinstaller>=6.22.3",
    "setuptools>=82.2.1",
]
